substitutions:
  bms8: "bms8"
  bms8_mac_address: C8:47:80:2B:83:85
  bms8_protocol_version: JK02_32S

ble_client:
  - mac_address: ${bms8_mac_address}
    id: "${bms8}_client"
    
jk_bms_ble:
  - ble_client_id: "${bms8}_client"
    protocol_version: ${bms8_protocol_version}
    throttle: 500ms
    id: "${bms8}_client_ble"

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: "${bms8}_client_ble"
    balancing:
      name: "${bms8} balancing"
    charging:
      name: "${bms8} charging"
    discharging:
      name: "${bms8} discharging"
    heating:
      name: "${bms8} heating"
    online_status:
      name: "${bms8} online status"

