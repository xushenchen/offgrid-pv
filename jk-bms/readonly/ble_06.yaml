substitutions:
  bms5: "bms5"
  bms5_mac_address: C8:47:80:2B:83:85
  bms5_protocol_version: JK02_32S

ble_client:
  - mac_address: ${bms5_mac_address}
    id: "${bms5}_client"
    
jk_bms_ble:
  - ble_client_id: "${bms5}_client"
    protocol_version: ${bms5_protocol_version}
    throttle: 500ms
    id: "${bms5}_client_ble"

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: "${bms5}_client_ble"
    balancing:
      name: "${bms5} balancing"
    charging:
      name: "${bms5} charging"
    discharging:
      name: "${bms5} discharging"
    heating:
      name: "${bms5} heating"
    online_status:
      name: "${bms5} online status"

