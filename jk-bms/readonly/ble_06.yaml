      name: "${bms5} charging"
    discharging:
      name: "${bms5} discharging"
    balancer:
      name: "${bms5} balancer"

  - platform: ble_client
    ble_client_id: "${bms5}_client"
    id: ${bms5}_ble_client_switch
    name: "${bms5} enable bluetooth connection"




text_sensor:
