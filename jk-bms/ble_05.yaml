substitutions:
  bms4: "bms4"
  bms4_mac_address: C8:47:80:2B:83:85
  bms4_protocol_version: JK02_32S

ble_client:
  - mac_address: ${bms4_mac_address}
    id: "${bms4}_client"
    
jk_bms_ble:
  - ble_client_id: "${bms4}_client"
    protocol_version: ${bms4_protocol_version}
    throttle: 500ms
    id: "${bms4}_client_ble"

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: "${bms4}_client_ble"
    balancing:
      name: "${bms4} balancing"
    charging:
      name: "${bms4} charging"
    discharging:
      name: "${bms4} discharging"
    heating:
      name: "${bms4} heating"
    online_status:
      name: "${bms4} online status"

button:
