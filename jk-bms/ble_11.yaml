substitutions:
  bms10: "bms10"
  bms10_mac_address: C8:47:80:2B:83:85
  bms10_protocol_version: JK02_32S

ble_client:
  - mac_address: ${bms10_mac_address}
    id: "${bms10}_client"
    
jk_bms_ble:
  - ble_client_id: "${bms10}_client"
    protocol_version: ${bms10_protocol_version}
    throttle: 500ms
    id: "${bms10}_client_ble"

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: "${bms10}_client_ble"
    balancing:
      name: "${bms10} balancing"
    charging:
      name: "${bms10} charging"
    discharging:
      name: "${bms10} discharging"
    heating:
      name: "${bms10} heating"
    online_status:
      name: "${bms10} online status"

button:
