substitutions:
  bms0: "bms0"
  bms0_modbus_controller_id: "bms0_modbus_controller"
  bms0_control_params_skip_updates: "20"   # 20 - update every 20th update cycle

# charging, discharging, and balancing binary_sensors made as the template sensors
# to optimize number of modbus requests
binary_sensor:
  - platform: template
    id: ${bms0}_charging
    name: "${bms0} charging"
    lambda: |-
      return id(${bms0}_charging_raw).state == 1;

  - platform: template
    id: ${bms0}_discharging
    name: "${bms0} discharging"
    lambda: |-
      return id(${bms0}_discharging_raw).state == 1;

  - platform: template
    id: ${bms0}_balancing
    name: "${bms0} balancing"
    lambda: |-
      return id(${bms0}_balancing_raw).state == 1;

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} charging float mode"
    address: 0x1114
    register_type: holding
    bitmask: 0x0200

sensor:
  # 0x106C 108 UINT32 4 RW    CellCount
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell count"
    address: 0x106C
    register_type: holding
    value_type: U_DWORD
    register_count: 8
    response_size: 8
    skip_updates: ${bms0_control_params_skip_updates}
    accuracy_decimals: 0

  # 0x107C 124 UINT32 4 RW    CapBatCell       mAH
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} battery capacity"
    address: 0x107C
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    skip_updates: ${bms0_control_params_skip_updates}
    unit_of_measurement: Ah
    device_class: energy_storage
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.001


  # 0x1200    0    UINT16    2    R    CellVol0    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 1"
    address: 0x1200
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1202    2    UINT16    2    R    CellVol1    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 2"
    address: 0x1202
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1204    4    UINT16    2    R    CellVol2    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 3"
    address: 0x1204
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1206    6    UINT16    2    R    CellVol3    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 4"
    address: 0x1206
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1208    8    UINT16    2    R    CellVol4    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 5"
    address: 0x1208
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x120A   10    UINT16    2    R    CellVol5    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 6"
    address: 0x120A
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x120C   12    UINT16    2    R    CellVol6    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 7"
    address: 0x120C
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x120E   14    UINT16    2    R    CellVol7    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 8"
    address: 0x120E
    register_type: holding
    value_type: U_WORD
    register_count: 2      # 56  Change to this value if you have 8 cells, otherwise set to 2
    response_size: 2       # 56  Change to this value if you have 8 cells, otherwise set to 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # Comment following part if you have 8 cells,
  # update `register_count` and `response_size` for cell #8 according to the comments

  # 0x1210   16    UINT16    2    R    CellVol8    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 9"
    address: 0x1210
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1212   18    UINT16    2    R    CellVol9    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 10"
    address: 0x1212
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1214   20    UINT16    2    R    CellVol10    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 11"
    address: 0x1214
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1216   22    UINT16    2    R    CellVol11    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 12"
    address: 0x1216
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1218   24    UINT16    2    R    CellVol12    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 13"
    address: 0x1218
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x121A   26    UINT16    2    R    CellVol13    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 14"
    address: 0x121A
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x121C   28    UINT16    2    R    CellVol14    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 15"
    address: 0x121C
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x121E   30    UINT16    2    R    CellVol15    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} cell voltage 16"
    address: 0x121E
    register_type: holding
    value_type: U_WORD
    register_count: 40
    response_size: 40
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1240   64    UINT32    4    R    CellStatus    (each bit indicates a attached cell)
  # 0x1244   68    UINT16    2    R    CellVolAverage    mV
  # 0x1246   70    UINT16    2    R    CellVoltageDifferenceMax    mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} delta cell voltage"
    address: 0x1246
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1248   72    UINT8/UINT8 2  R    MaxVolCellNbr / MinVolCellNbr
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} max voltage cell number"
    address: 0x1248
    register_type: holding
    value_type: U_WORD
    register_count: 44
    response_size: 44
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    bitmask: 0xFF00
    filters:
      - offset: 1.0

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} min voltage cell number"
    address: 0x1248
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    bitmask: 0x00FF
    filters:
      - offset: 1.0

  # 0x128A   138    INT16    2    R    TempMos         0.1 °C
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} mosfet temperature"
    address: 0x128A
    register_type: holding
    value_type: S_WORD
    register_count: 6
    response_size: 6
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.1

  # 0x128C   140   UINT32    4    R    CellWireResSta  Bit per Cell
  # 0x1290   144   UINT32    4    R    BatVol          mV
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    id: ${bms0}_total_voltage
    name: "${bms0} total voltage"
    address: 0x1290
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1294   148   UINT32    4    R    BatWatt         mW
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} power"
    address: 0x1294
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          return id(${bms0}_current).state < 0
            ? x * -1
            : x;
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} charging power"
    address: 0x1298
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
      - lambda: |-
          if (x > 0.0f && !isnan(id(${bms0}_total_voltage).state)) {
            return x * id(${bms0}_total_voltage).state;
          }
          return 0.0f;

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} discharging power"
    address: 0x1298
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
      - lambda: |-
          if (x < 0.0f && !isnan(id(${bms0}_total_voltage).state)) {
            return abs(x) * id(${bms0}_total_voltage).state;
          }
          return 0.0f;

  # 0x1298   152    INT32    4    R    BatCurrent      mA
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    id: ${bms0}_current
    name: "${bms0} current"
    address: 0x1298
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} charging current"
    address: 0x1298
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
      - lambda: |-
          if (x > 0.0f) {
            return x;
          }
          return 0.0f;

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} discharging current"
    address: 0x1298
    register_type: holding
    value_type: S_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
      - lambda: |-
          if (x < 0.0f) {
            return abs(x);
          }
          return 0.0f;

  # 0x129C   156    INT16    2    R    TempBat 1       0.1 °C
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} temperature sensor 1"
    address: 0x129C
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x129E   158    INT16    2    R    TempBat 2       0.1 °C
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} temperature sensor 2"
    address: 0x129E
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x12A0   160   UINT32    4    R    AlarmBitmask
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    id: ${bms0}_alarms_bitmask
    name: "${bms0} alarms bitmask"
    address: 0x12A0
    register_type: holding
    value_type: U_DWORD
    register_count: 2
    response_size: 4
    disabled_by_default: true
    on_value:
      - component.update: ${bms0}_alarms

  # 0x12A4   164    INT16    2    R    BalanCurrent    mA
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} balance current"
    address: 0x12A4
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001

  # 0x12A6   166 UINT8+UINT8 2    R    BalanStatatus (2:放电; 1:充电 ; 0:关闭) / SOCStateOfcharge %
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} state of charge"
    address: 0x12A6
    register_type: holding
    value_type: U_WORD
    state_class: measurement
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    bitmask: 0x00FF

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    id: "${bms0}_balancing_raw"
    address: 0x12A6
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    disabled_by_default: true
    bitmask: 0x01

  # 0x12A8   168    INT32    2    R    SOCCapRemain    mAH
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} capacity remaining derived"
    address: 0x12A8
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    device_class: energy_storage
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12AC   172   UINT32    4    R    SOCFullChargeCap    mAH
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} actual battery capacity"
    address: 0x12AC
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    device_class: energy_storage
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B0   176   UINT32    4    R    SOCCycleCount   次
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} charging cycles"
    address: 0x12B0
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    accuracy_decimals: 0

  # 0x12B4   180   UINT32    4    R    SOCCycleCap     mAH
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} total charging cycle capacity"
    address: 0x12B4
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B8   184 UINT8+UINT8 2    R    StateOfHealth % / Precharge stats (1:打开 ; 0:关闭)
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} state of health"
    address: 0x12B8
    register_type: holding
    value_type: U_WORD
    register_count: 4
    response_size: 4
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return data[item->offset];

  # 0x12BA   186   UINT16    2    R    UserAlarm

  # 0x12BC   188   UINT32    4    R    RunTime         S
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} total runtime in seconds"
    address: 0x12BC
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    id: ${bms0}_total_runtime

  # 0x12C0   192 UINT8+UINT8 Charge (1:打开 ; 0:关闭) / Discharge (1:打开 ; 0:关闭)
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    id: ${bms0}_charging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    disabled_by_default: true
    bitmask: 0xFF00

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    id: ${bms0}_discharging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    disabled_by_default: true
    bitmask: 0x00FF

  # 0x12C2   194   UINT16    2    R    UserAlarm2
  # - platform: modbus_controller
  #   modbus_controller_id: ${bms0_modbus_controller_id}
  #   name: "UserAlarm2 Status"
  #   address: 0x12C2
  #   register_type: holding
  #   value_type: U_WORD
  #   register_count: 2
  #   response_size: 2
  #   state_class: measurement
  #   accuracy_decimals: 0

  # 0x12D0   208 UINT8+UINT8 2    R    AbsentBitmask (Bit0: MOS TempSensorAbsent, Bit1: BATTempSensor1Absent, Bit2: BATTempSensor2Absent, Bit4: BATTempSensor4Absent, Bit5: BATTempSensor5Absent) / Heating
  # 0x12D2   210   UINT16    2    R    Reserved
  # 0x12D4   212   UINT16    2    R    TimeEmergency   S
  # 0x12D6   214   UINT16    2    R    BatCurCorrect
  # 0x12D8   216   UINT16    2    R    VolChargCur     mV
  # 0x12DA   218   UINT16    2    R    VolDischargCur  mV
  # 0x12DC   214   FLOAT     4    R    BatVolCorrect
  # 0x12E4   228   UINT16    2    R    BatVol          0.01V
  # 0x12E6   230   INT16     2    R    HeatCurrent     mA
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} heating current"
    address: 0x12E6
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x12F0   240   UINT32    4    R    SysRunTicks     0.1S

  # 0x12F8   248   INT16     2    R    TempBat 3       0.1℃
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} temperature sensor 3"
    address: 0x12F8
    register_type: holding
    value_type: S_WORD
