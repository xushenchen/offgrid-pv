select:
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} charging"
    icon: "mdi:battery-charging-100"
    address: 0x1070
    value_type: U_DWORD
    skip_updates: 5
    optionsmap:
      "Off": 0
      "On": 1

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} discharging"
    icon: "mdi:power-plug-battery"
    address: 0x1074
    value_type: U_DWORD
    skip_updates: 5
    optionsmap:
      "Off": 0
      "On": 1

  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} balancing"
    icon: mdi:scale-balance
    address: 0x1078
    value_type: U_DWORD
    skip_updates: 5
    optionsmap:
      "Off": 0
      "On": 1

text_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${bms0_modbus_controller_id}
    name: "${bms0} setup passcode"
    register_type: holding
    address: 0x1470  # 0x1400 base + 0x0070 offset
    register_count: 8
    response_size: 16
    raw_encode: ANSI

  - platform: template
    name: "${bms0} total runtime formatted"
    update_interval: 60s
    lambda: |-
      std::string value = "Unknown";
      if (id(${bms0}_total_runtime) && !isnan(id(${bms0}_total_runtime).state)) {
        uint32_t seconds = (uint32_t) id(${bms0}_total_runtime).state;
        uint32_t years = seconds / (24 * 3600 * 365);
        seconds = seconds % (24 * 3600 * 365);
        uint32_t days = seconds / (24 * 3600);
        seconds = seconds % (24 * 3600);
        uint32_t hours = seconds / 3600;
        value = (years ? to_string(years) + "y " : "") + (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h" : "");
      }
      return value;

  - platform: template
    id: ${bms0}_alarms
    name: "${bms0} alarms"
    update_interval: never
    lambda: |-
      static const uint8_t alarms_size = 22;
      static const char *const alarms[alarms_size] = {
        "Wire resistance",
        "MOS OTP",
        "Cell quantity",
        "Current sensor error",
        "Cell OVP",
        "Battery OVP",
        "Charge OCP",
        "Charge SCP",
        "Charge OTP",
        "Charge UTP",
        "CPU Aux comm error",
        "Cell UVP",
        "Batt UVP",
        "Discharge OCP",
        "Discharge SCP",
        "Discharge OTP",
        "Charge MOS",
        "Discharge MOS",
        "GPS Disconnected",
        "Modify PWD. in time",
        "Discharge On Failed",
        "Battery Over Temp Alarm"
      };
      std::string values = "";
      uint32_t mask = id(${bms0}_alarms_bitmask)->state;
      if (mask) {
        for (int i = 0; i < alarms_size; i++) {
          if (mask & (1 << i)) {
            values.append(alarms[i]);
            values.append("; ");
          }
        }
        if (!values.empty()) {
          values.pop_back();
        }
      }
      return values;