      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_a_pf"
    register_type: holding
    address: 0x193
    value_type: S_WORD
    accuracy_decimals: 2
    unit_of_measurement: cosφ
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_b_pf"
    register_type: holding
    address: 0x194
    value_type: S_WORD
    accuracy_decimals: 2
    unit_of_measurement: cosφ
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_c_pf"
    register_type: holding
    address: 0x195
    value_type: S_WORD
    accuracy_decimals: 2
    unit_of_measurement: cosφ
    filters:
      - multiply: 0.001

# 相角
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_a_pa"
    register_type: holding
    address: 0x196
    value_type: S_WORD
    accuracy_decimals: 2
    unit_of_measurement: φ
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_b_pa"
    register_type: holding
    address: 0x197
    value_type: S_WORD
    accuracy_decimals: 2
    unit_of_measurement: φ
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_c_pa"
    register_type: holding
    address: 0x198
    value_type: S_WORD
    accuracy_decimals: 2
    unit_of_measurement: φ
    filters:
      - multiply: 0.1

# 频率
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_freq"
    register_type: holding
    address: 0x199
    value_type: S_WORD
    accuracy_decimals: 2
    unit_of_measurement: Hz
    filters:
      - multiply: 0.01
      - median:
          window_size: 3
          send_every: 3

# 电量
  # 总的有功电能
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_1_modbus_controller}
    name: "${yada_3366_1_1_name}_ap"
    register_type: holding
    address: 0x100
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 0.01
  # 总的反向有功电能
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_1_modbus_controller}
    name: "${yada_3366_1_1_name}_an"
    register_type: holding
    address: 0x114
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 0.01

# 统计相关计算
  # 总计用电量
  - platform: total_daily_energy
    name: ${yada_3366_1_2_name}_today_energy
    id: ${yada_3366_1_2_name}_today_energy
    power_id: ${yada_3366_1_2_name}_p
    filters:
      - multiply: 0.0001
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    restore: true
    method: right
    accuracy_decimals: 1
    # 利用 on_value 触发回调，当传感器归零（新的一天）时，将前一天的值累加入月累计中
    on_value:
      then:
        - lambda: |-
            float sensor_value = x;
            static float last_reading = 0.0;
            if (sensor_value < last_reading || sensor_value == 0.0) {
              id(${yada_3366_1_2_name}_yesterday_energy_sum) = last_reading;
              auto now = id(esptime).now();
              time_t rawtime = now.timestamp;
              struct tm * timeinfo = localtime(&rawtime);
              if (timeinfo->tm_mday == 1) {
                id(${yada_3366_1_2_name}_month_energy_sum) = 0.0;
              } else {
                id(${yada_3366_1_2_name}_month_energy_sum) += last_reading;
              }
            }
            last_reading = sensor_value;
  # A相用电量
  - platform: total_daily_energy
    name: ${yada_3366_1_2_name}_a_today_energy
    id: ${yada_3366_1_2_name}_a_today_energy
    power_id: ${yada_3366_1_2_name}_a_p
    filters:
      - multiply: 0.0001
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    restore: true
    method: right
    accuracy_decimals: 1
    # 利用 on_value 触发回调，当传感器归零（新的一天）时，将前一天的值累加入月累计中
    on_value:
      then:
        - lambda: |-
            float sensor_value = x;
            static float last_reading = 0.0;
            if (sensor_value < last_reading || sensor_value == 0.0) {
              id(${yada_3366_1_2_name}_a_yesterday_energy_sum) = last_reading;
              auto now = id(esptime).now();
              time_t rawtime = now.timestamp;
              struct tm * timeinfo = localtime(&rawtime);
              if (timeinfo->tm_mday == 1) {
                id(${yada_3366_1_2_name}_a_month_energy_sum) = 0.0;
              } else {
                id(${yada_3366_1_2_name}_a_month_energy_sum) += last_reading;
              }
            }
            last_reading = sensor_value;
  - platform: total_daily_energy
    name: ${yada_3366_1_2_name}_b_today_energy
    id: ${yada_3366_1_2_name}_b_today_energy
    power_id: ${yada_3366_1_2_name}_b_p
    filters:
      - multiply: 0.0001
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    restore: true
    method: right
    accuracy_decimals: 1
    # 利用 on_value 触发回调，当传感器归零（新的一天）时，将前一天的值累加入月累计中
    on_value:
      then:
        - lambda: |-
            float sensor_value = x;
            static float last_reading = 0.0;
            if (sensor_value < last_reading || sensor_value == 0.0) {
              id(${yada_3366_1_2_name}_b_yesterday_energy_sum) = last_reading;
              auto now = id(esptime).now();
              time_t rawtime = now.timestamp;
              struct tm * timeinfo = localtime(&rawtime);
              if (timeinfo->tm_mday == 1) {
                id(${yada_3366_1_2_name}_b_month_energy_sum) = 0.0;
              } else {
                id(${yada_3366_1_2_name}_b_month_energy_sum) += last_reading;
              }
            }
            last_reading = sensor_value;
  - platform: total_daily_energy
    name: ${yada_3366_1_2_name}_c_today_energy
    id: ${yada_3366_1_2_name}_c_today_energy
    power_id: ${yada_3366_1_2_name}_c_p
    filters:
      - multiply: 0.0001
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    restore: true
    method: right
    accuracy_decimals: 1
    # 利用 on_value 触发回调，当传感器归零（新的一天）时，将前一天的值累加入月累计中
    on_value:
      then:
        - lambda: |-
            float sensor_value = x;
            static float last_reading = 0.0;
            if (sensor_value < last_reading || sensor_value == 0.0) {
