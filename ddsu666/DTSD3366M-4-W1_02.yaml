substitutions:
  yada_3366_1_2_name: meter_1_2
  yada_3366_2_modbus_controller: meter_2_modbus_controller

globals:
  - id: ${yada_3366_1_2_name}_month_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_yesterday_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_a_month_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_a_yesterday_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_b_month_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_b_yesterday_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_c_month_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_c_yesterday_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'

# 传感器
sensor:

# 电压
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_a_u"
    register_type: holding
    address: 0x16e
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 0.0001
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_b_u"
    register_type: holding
    address: 0x170
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 0.0001
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_c_u"
    register_type: holding
    address: 0x172
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: V
    device_class: voltage
    filters:
      - multiply: 0.0001

# 电流
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_a_i"
    register_type: holding
    address: 0x174
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: A
    device_class: current
    filters:
      - multiply: 0.0001
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_b_i"
    register_type: holding
    address: 0x176
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: A
    device_class: current
    filters:
      - multiply: 0.0001
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_c_i"
    register_type: holding
    address: 0x178
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: A
    device_class: current
    filters:
      - multiply: 0.0001
      
# 有功功率
  # 瞬间有功功率
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_p"
    id: "${yada_3366_1_2_name}_p"
    register_type: holding
    address: 0x17a
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: W
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_a_p"
    id: "${yada_3366_1_2_name}_a_p"
    register_type: holding
    address: 0x17c
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: W
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_b_p"
    id: "${yada_3366_1_2_name}_b_p"
    register_type: holding
    address: 0x17e
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: W
    state_class: total_increasing
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_c_p"
    id: "${yada_3366_1_2_name}_c_p"
    register_type: holding
    address: 0x180
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: W
    filters:
      - multiply: 0.1

# 无功功率
  # 瞬时总无功有功率
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_q"
    register_type: holding
    address: 0x182
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: var
    device_class: power
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_a_q"
    register_type: holding
    address: 0x184
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: var
    device_class: power
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_b_q"
    register_type: holding
    address: 0x186
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: var
    device_class: power
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_c_q"
    register_type: holding
    address: 0x188
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: var
    device_class: power
    filters:
      - multiply: 0.1

# 视在功率
  # 瞬间视在功率
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_s"
    register_type: holding
    address: 0x18a
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: va
    device_class: power
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_2_modbus_controller}
    name: "${yada_3366_1_2_name}_a_s"
    register_type: holding
    address: 0x18c
    register_count: 2
    value_type: S_DWORD
    accuracy_decimals: 2
    unit_of_measurement: va
    device_class: power
    filters:
      - multiply: 0.1

  - platform: modbus_controller
