    lambda: |-
      return id(${yada_3366_1_2_name}_yesterday_energy_sum);
    update_interval: 30s
    unit_of_measurement: "kWh"
    icon: "mdi:flash"
  # 今日用电量
  - platform: template
    name: ${yada_3366_1_2_name}_today_energy
