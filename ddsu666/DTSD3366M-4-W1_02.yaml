# 统计相关显示
  # 当月用电量
  - platform: template
    name: ${yada_3366_1_2_name}_monthly_energy
    id: ${yada_3366_1_2_name}_monthly_energy
    lambda: |-
      return id(${yada_3366_1_2_name}_month_energy_sum) + id(${yada_3366_1_2_name}_today_energy).state;
    update_interval: 60s
    unit_of_measurement: "kWh"
    icon: "mdi:flash"
  # 昨日用电量
  - platform: template
    name: ${yada_3366_1_2_name}_yesterday_energy
    id: ${yada_3366_1_2_name}_yesterday_energy
