substitutions:
  yada_3366_1_2_name: meter_1_2
  yada_3366_2_modbus_controller: meter_2_modbus_controller

globals:
  # 记录上次处理的日期
  - id: ${yada_3366_1_2_name}_last_processed_day
    type: int
    restore_value: yes
    initial_value: '0'

  - id: ${yada_3366_1_2_name}_day_start_energy
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_month_start_energy
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: ${yada_3366_1_2_name}_yesterday_energy_sum
    type: float
    restore_value: true
    initial_value: '0.0'
    

script:
  # 检查每日、每月的用电量情况
  - id: ${yada_3366_1_2_name}_check_day_rollover
    then:
      - lambda: |-
          auto now = id(esptime).now();
          if (!now.is_valid()) return;
          int today = now.day_of_year;

          if (today != id(${yada_3366_1_2_name}_last_processed_day)) {
            
            float total = id(${yada_3366_1_2_name}_ap).state;
            float yesterday = total - id(${yada_3366_1_2_name}_day_start_energy);
            if (yesterday >= 0) {
              id(${yada_3366_1_2_name}_yesterday_energy_sum) = yesterday;
            }
            id(${yada_3366_1_2_name}_day_start_energy) = total;
            if (now.day_of_month == 1) {
              id(${yada_3366_1_2_name}_month_start_energy) = total;
            }

            id(${yada_3366_1_2_name}_last_processed_day) = today;
          }

interval:
  - interval: 5min
    then:
      - script.execute: ${yada_3366_1_2_name}_check_day_rollover
  - interval: 5s
    then:
      - lambda: |-
          auto now = id(esptime).now();
          if (!now.is_valid()) return;
          if (now.hour == 0 && now.minute == 0 && now.second < 20) {
            id(${yada_3366_1_2_name}_check_day_rollover).execute();
          }


# 传感器
