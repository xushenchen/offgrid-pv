substitutions:
  yada_3366_1_name: meter_1
  yada_3366_1_1_name: meter_1_1
  yada_3366_1_modbus_controller: meter_1_modbus_controller

sensor:

# 电压
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_1_modbus_controller}
    name: "${yada_3366_1_1_name}_a_u"
    register_type: holding
    address: 0x16e
    register_count: 2
    value_type: U_DWORD
    accuracy_decimals: 2
    unit_of_measurement: V
    filters:
      - multiply: 0.0001
  - platform: modbus_controller
    modbus_controller_id: ${yada_3366_1_modbus_controller}
