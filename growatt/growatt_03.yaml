select:
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} AC Output Set"
    address: 1                          # 寄存器位置 0x0001
    value_type: U_WORD                 # 16 位无符号整数
    optionsmap:                         # 将下拉选项和数值一一映射
      "电池优先": 0
      "光伏优先": 1
      "市电优先": 2
    skip_updates: ${growatt2_control_params_skip_updates}
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
