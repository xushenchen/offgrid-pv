# 需要统一提供一个esptime的时间
substitutions:
  growatt2_modbus_controller_id: growatt2_modbus_controller
  growatt2_device_name: growatt2
  growatt2_control_params_skip_updates: 0


interval:
  - interval: 29h
    then:
      - switch.turn_on: "${growatt2_device_name}_write_current_time_to_modbus"

sensor:    
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} System Status"
    id: ${growatt2_device_name}_system_status
    address: 0
    register_type: "read"
    icon: mdi:flash
    value_type: U_WORD
    skip_updates: ${growatt2_control_params_skip_updates}

  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    id: "${growatt2_device_name}_PV1_DcPower"
    name: "${growatt2_device_name} PV1 DcPower"
    address: 3
    register_type: "read"
    unit_of_measurement: W
    device_class: power
    icon: mdi:flash
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
    
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} PV1 DcVoltage"
    address: 1
    register_type: "read"
    unit_of_measurement: V
    device_class: voltage
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
    
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} PV1 DcInputCurrent"
    address: 7
    register_type: "read"
    unit_of_measurement: A
    device_class: current
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    id: "${growatt2_device_name}_PV2_DcPower"
    name: "${growatt2_device_name} PV2 DcPower"
    address: 5
    register_type: "read"
    unit_of_measurement: W
    device_class: power
    icon: mdi:flash
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
       
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} PV2 DcVoltage"
    address: 2
    register_type: "read"
    unit_of_measurement: V
    device_class: voltage
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
   
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} PV2 DcInputCurrent"
    address: 8
    register_type: "read"
    unit_of_measurement: A
    device_class: current
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
  # 输出有功功率
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} Output active power"
    address: 9
    register_type: "read"
    unit_of_measurement: W
    device_class: power
    icon: mdi:flash
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  # 输出包括无功功率
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} Output apparent power"
    address: 11
    register_type: "read"
    unit_of_measurement: VA
    device_class: power
    icon: mdi:flash
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
  # AC输入频率
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} Ac Input Frequency"
    address: 21
    register_type: "read"
    unit_of_measurement: Hz
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.01
    skip_updates: ${growatt2_control_params_skip_updates}
  # AC输出频率
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} AC output frequency"
    address: 23
    register_type: "read"
    unit_of_measurement: Hz
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.01
  # AC输出电压
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} AC output Volt"
    address: 22
    register_type: "read"
    unit_of_measurement: V
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
  # 市电接入电压
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} Grid Volt"
    address: 20
    register_type: "read"
    unit_of_measurement: V
    device_class: voltage
    icon: mdi:flash
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
    skip_updates: ${growatt2_control_params_skip_updates}
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} AC input watt"
    address: 36
    register_type: "read"
    unit_of_measurement: W
    device_class: power
    icon: mdi:flash
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
    - multiply: 0.1
  # AC输出功率
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} AC discharge watt"
    address: 69
    register_type: "read"
    unit_of_measurement: W
    device_class: power
    icon: mdi:flash
    value_type: U_DWORD
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (x == 0xFFFFFFFF || x > 4000000000) {
            return 0;
          }
          return x * 0.1;
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} Output Current"
    address: 34
    register_type: "read"
    unit_of_measurement: A
    device_class: current
    icon: mdi:flash
    value_type: U_WORD
