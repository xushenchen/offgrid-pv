switch:
  - platform: template
    name: "${growatt2_device_name} Write Current Time to Modbus"
    id: "${growatt2_device_name}_write_current_time_to_modbus"
    optimistic: true
    turn_on_action:
      - lambda: |-
          auto t = id(esptime).now();
          uint16_t year   = t.year;
          uint16_t month  = t.month;
          uint16_t day    = t.day_of_month;
          uint16_t hour   = t.hour;
          uint16_t minute = t.minute;
          uint16_t second = t.second;

          ESP_LOGD("time_write", "Will write %04u-%02u-%02u %02u:%02u:%02u",
                   year, month, day, hour, minute, second);

          std::vector<uint16_t> vals;
          vals.push_back(year);
          vals.push_back(month);
          vals.push_back(day);
          vals.push_back(hour);
          vals.push_back(minute);
          vals.push_back(second);

          // 创建写多个寄存器命令（start address = 45）
          uint16_t start_address = 45;
          uint16_t quantity = static_cast<uint16_t>(vals.size());
          auto cmd = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
                        id(${growatt2_modbus_controller_id}), start_address, quantity, vals);
          // 把命令入队（ModbusController 会在合适时间发送）
          id(${growatt2_modbus_controller_id})->queue_command(cmd);
          ESP_LOGI("time_write", "Queued write-multiple-registers command");
          
      - delay: 500ms
      - switch.turn_off: "${growatt2_device_name}_write_current_time_to_modbus"
