    lambda: |-
      return (-1 * id(${growatt2_device_name}_battery_watts).state) / id(${growatt2_device_name}_battery_voltage).state;
    update_interval: 1s

text_sensor:
  - platform: template
    name: "${growatt2_device_name} System Status Text"
    update_interval: 5s
    lambda: |-
      int value = (int) id(${growatt2_device_name}_system_status).state;
      if (value == 0) {
        return {"待机"}; // Standby
      } else if (value == 1) {
        return {"未使用"}; // (No Use)
      } else if (value == 2) {
        return {"放电"}; // Discharge
      } else if (value == 3) {
        return {"故障"}; // Fault
      } else if (value == 4) {
        return {"闪充"}; // Flash
      } else if (value == 5) {
        return {"光伏充电"}; // PV charge
      } else if (value == 6) {
        return {"交流充电"}; // AC charge
      } else if (value == 7) {
        return {"组合充电"}; // Combine charge
      } else if (value == 8) {
        return {"组合充及旁路"}; // Combine charge and Bypass
      } else if (value == 9) {
        return {"光伏充及旁路"}; // PV charge and Bypass
      } else if (value == 10) {
        return {"交流充及旁路"}; // AC charge and Bypass
      } else if (value == 11) {
        return {"旁路"}; // Bypass
      } else if (value == 12) {
        return {"光伏充放电"}; // PV charge and Discharge
      } else if (value == 14) {
        return {"光伏&电池联合"};
      } else {
        return { to_string(value) }; // Unknown
      }
  - platform: template
    name: "${growatt2_device_name} Sys Time (readable)"
    id: ${growatt2_device_name}_sys_time_readable
    lambda: |-
      if (isnan(id(${growatt2_device_name}_sys_time_year_set).state) ||
          isnan(id(${growatt2_device_name}_sys_time_month_set).state) ||
          isnan(id(${growatt2_device_name}_sys_time_day_set).state) ||
          isnan(id(${growatt2_device_name}_sys_time_hour_set).state) ||
          isnan(id(${growatt2_device_name}_sys_time_min_set).state) ||
          isnan(id(${growatt2_device_name}_sys_time_second_set).state)) {
        return std::string("unknown");
      }
      char buf[32];
      sprintf(buf, "%04d-%02d-%02d %02d:%02d:%02d",
        (int)id(${growatt2_device_name}_sys_time_year_set).state,
        (int)id(${growatt2_device_name}_sys_time_month_set).state,
        (int)id(${growatt2_device_name}_sys_time_day_set).state,
        (int)id(${growatt2_device_name}_sys_time_hour_set).state,
        (int)id(${growatt2_device_name}_sys_time_min_set).state,
        (int)id(${growatt2_device_name}_sys_time_second_set).state);
      return std::string(buf);
    update_interval: 20s

number:
  # 最大充电电流
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} Max Charge Current Set"
    id: "${growatt2_device_name}_max_charge_current_set"
    address: 34
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 2
    max_value: 280
    step: 1
    skip_updates: ${growatt2_control_params_skip_updates}
  # 市电充电电流
  - platform: modbus_controller
    modbus_controller_id: ${growatt2_modbus_controller_id}
    name: "${growatt2_device_name} Float Charge Current Set"
    id: "${growatt2_device_name}_float_charge_current_set"
    address: 38
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 0
    max_value: 800
    step: 1
    skip_updates: ${growatt2_control_params_skip_updates}
  # 大概率是强充电压（数据/10）
  - platform: modbus_controller
